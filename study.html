<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luyện Học HSK</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=Noto+Sans+SC:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 20px 16px;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .back-btn {
      text-decoration: none;
      color: var(--text-sub);
      font-weight: 600;
      font-size: 14px;
      padding: 8px 12px;
      background: #ffffff;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .level-title {
      font-size: 18px;
      font-weight: 700;
    }

    /* Big Flashcard */
    .flashcard {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px 24px;
      text-align: center;
      margin: 24px 0;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 280px;
      cursor: pointer;
    }

    .hanzi {
      font-size: 56px;
      font-family: 'Noto Sans SC', sans-serif;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 12px;
    }

    .pinyin {
      font-size: 20px;
      color: var(--text-sub);
      font-weight: 600;
      margin-bottom: 8px;
    }

    .meaning {
      font-size: 18px;
      color: var(--text-main);
      font-weight: 600;
    }

    /* Buttons */
    .btn-group {
      display: flex;
      gap: 12px;
    }

    .btn {
      flex: 1;
      padding: 16px;
      border: none;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-speak {
      background-color: #eff6ff;
      color: var(--primary);
    }

    .btn-next {
      background-color: var(--primary);
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="top-bar">
      <a href="index.html" class="back-btn">❮ Quay lại</a>
      <div class="level-title" id="hskLevelText">HSK 1</div>
      <div style="width: 70px;"></div>
    </div>

    <!-- Flashcard -->
    <div class="flashcard" onclick="speakWord()">
      <div class="hanzi" id="hanzi">你好</div>
      <div class="pinyin" id="pinyin">nǐ hǎo</div>
      <div class="meaning" id="meaning">Xin chào</div>
    </div>

    <div class="btn-group">
      <button class="btn btn-speak" onclick="speakWord()">🔊 Phát âm</button>
      <button class="btn btn-next" onclick="nextWord()">Từ tiếp theo ❯</button>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const level = urlParams.get('level') || '1';
    document.getElementById('hskLevelText').innerText = `HSK ${level}`;

    let currentWordList = [];

    fetch('./hsk_data.json')
      .then(res => res.json())
      .then(data => {
        currentWordList = data[`hsk${level}`] || [];
        nextWord();
      });

    function nextWord() {
      if (currentWordList.length === 0) return;
      const random = currentWordList[Math.floor(Math.random() * currentWordList.length)];
      
      document.getElementById('hanzi').innerText = random.hanzi;
      document.getElementById('pinyin').innerText = random.pinyin;
      document.getElementById('meaning').innerText = random.meaning;
    }

    function speakWord() {
      const text = document.getElementById('hanzi').innerText;
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const msg = new SpeechSynthesisUtterance(text);
      msg.lang = 'zh-CN';
      msg.rate = 0.8;
      window.speechSynthesis.speak(msg);
    }
  </script>
</body>
</html>
