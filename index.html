<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HSK Master - Học Tiếng Trung</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --primary-light: #eff6ff;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --border: #e2e8f0;
      --success: #22c55e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding-bottom: 70px; /* Nhường chỗ cho thanh menu đáy */
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      padding: 20px 16px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      background: var(--primary);
      color: white;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 20px;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-main);
    }

    /* Progress Banner */
    .progress-banner {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .progress-title {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .progress-bar {
      height: 8px;
      background: #e2e8f0;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      width: 60%;
      height: 100%;
      background: var(--success);
      border-radius: 4px;
    }

    /* Search Box */
    .search-box {
      margin-bottom: 24px;
    }

    .search-box input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      outline: none;
      font-size: 14px;
      color: var(--text-main);
    }

    .search-box input:focus {
      border-color: var(--primary);
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 14px;
      color: var(--text-main);
    }

    /* HSK Cards Grid */
    .hsk-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .hsk-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 16px;
      text-decoration: none;
      color: var(--text-main);
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }

    .hsk-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.08);
    }

    .hsk-tag {
      align-self: flex-start;
      background: var(--primary-light);
      color: var(--primary);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
    }

    .hsk-card h3 {
      font-size: 16px;
      font-weight: 700;
      margin-top: 4px;
    }

    .hsk-card p {
      font-size: 12px;
      color: var(--text-sub);
    }

    /* Bottom Navigation Bar */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      height: 60px;
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-sub);
      text-decoration: none;
      font-size: 11px;
      font-weight: 600;
    }

    .nav-item.active {
      color: var(--primary);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <div class="header">
      <div class="brand">
        <div class="brand-icon">華</div>
        <div class="brand-title">HSK Master</div>
      </div>
    </div>

    <!-- Progress Banner -->
    <div class="progress-banner">
      <div class="progress-title">
        <span>Tiến độ học hôm nay</span>
        <span style="color: var(--success)">60%</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill"></div>
      </div>
    </div>

    <!-- Search Box -->
    <div class="search-box">
      <input type="text" placeholder="🔍 Tìm kiếm từ vựng HSK...">
    </div>

    <!-- HSK List -->
    <div class="section-title">Danh sách cấp độ HSK</div>
    <div class="hsk-grid">
      <a href="study.html?level=1" class="hsk-card">
        <span class="hsk-tag">Cơ bản</span>
        <h3>HSK 1</h3>
        <p>150 từ vựng</p>
      </a>

      <a href="study.html?level=2" class="hsk-card">
        <span class="hsk-tag">Cơ bản</span>
        <h3>HSK 2</h3>
        <p>150 từ vựng</p>
      </a>

      <a href="study.html?level=3" class="hsk-card">
        <span class="hsk-tag" style="background:#fef3c7; color:#d97706;">Trung cấp</span>
        <h3>HSK 3</h3>
        <p>300 từ vựng</p>
      </a>

      <a href="study.html?level=4" class="hsk-card">
        <span class="hsk-tag" style="background:#fef3c7; color:#d97706;">Trung cấp</span>
        <h3>HSK 4</h3>
        <p>600 từ vựng</p>
      </a>

      <a href="study.html?level=5" class="hsk-card">
        <span class="hsk-tag" style="background:#fce7f3; color:#db2777;">Cao cấp</span>
        <h3>HSK 5</h3>
        <p>1300 từ vựng</p>
      </a>

      <a href="study.html?level=6" class="hsk-card">
        <span class="hsk-tag" style="background:#fce7f3; color:#db2777;">Cao cấp</span>
        <h3>HSK 6</h3>
        <p>2500 từ vựng</p>
      </a>
    </div>
  </div>

  <!-- Bottom Nav -->
  <div class="bottom-nav">
    <a href="#" class="nav-item active">🏠 Trang chủ</a>
    <a href="#" class="nav-item">📚 Từ vựng</a>
    <a href="#" class="nav-item">❤️ Đã lưu</a>
    <a href="#" class="nav-item">👤 Tài khoản</a>
  </div>

</body>
</html>
